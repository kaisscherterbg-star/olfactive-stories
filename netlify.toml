# Site statique : aucune commande de build, le dossier racine est publié tel quel.
[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Les pages /parfum/<nom>/ sont de vrais fichiers ; /404.html est servi automatiquement pour toute adresse inconnue.
